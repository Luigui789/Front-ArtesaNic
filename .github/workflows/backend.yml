name: Backend
on:
  push:
    paths: ['apps/backend/**', 'docs/api/**', '.github/workflows/backend.yml', '.gitattributes']
  pull_request:
    paths: ['apps/backend/**', 'docs/api/**', '.github/workflows/backend.yml', '.gitattributes']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: artesanic
          POSTGRES_USER: artesanic
          POSTGRES_PASSWORD: contrasena-exclusiva-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artesanic -d artesanic"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: clave-exclusiva-de-ci-sin-uso-en-produccion
      POSTGRES_DB: artesanic
      POSTGRES_USER: artesanic
      POSTGRES_PASSWORD: contrasena-exclusiva-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.22
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py test
