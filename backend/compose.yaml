# Dependencias locales de desarrollo. Solo PostgreSQL: Django se ejecuta en el
# host con uv (ADR-008). No es configuración de despliegue.
#
# Las variables se toman del archivo .env de esta carpeta (el mismo que lee Django).
name: artesanic

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    ports:
      # Solo en la interfaz local. 5434 por defecto: el 5432 suele estar
      # ocupado por un PostgreSQL del sistema y el 5433 por otros proyectos.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
